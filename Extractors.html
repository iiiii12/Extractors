<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi-Provider Social Media & Maps Downloader</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --error: #ef4444;
      --success: #22c55e;
      --badge-video: #8b5cf6;
      --badge-image: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .main-wrapper {
      max-width: 1200px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      text-align: center;
      margin-bottom: 1rem;
    }

    header h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* 2-COLUMN GRID LAYOUT */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.5rem;
    }

    @media (max-width: 850px) {
      .grid-container {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card h2 {
      font-size: 1.15rem;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .input-group {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.75rem;
      margin-bottom: 0.75rem;
    }

    input[type="text"] {
      flex: 1;
      background-color: var(--bg-color);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.65rem 0.85rem;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      min-width: 0;
    }

    input:focus {
      border-color: var(--accent);
    }

    button {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 0.65rem 1.1rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    .btn-secondary {
      background-color: transparent;
      border: 1px solid var(--border);
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background-color: var(--border);
    }

    .output-area {
      margin-top: 0.75rem;
      border-top: 1px solid var(--border);
      padding-top: 0.75rem;
      display: none;
    }

    .output-area.active {
      display: block;
    }

    .media-badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 15px;
      font-size: 0.75rem;
      font-weight: bold;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }

    .badge-video {
      background-color: rgba(139, 92, 246, 0.2);
      color: var(--badge-video);
      border: 1px solid var(--badge-video);
    }

    .badge-image {
      background-color: rgba(16, 185, 129, 0.2);
      color: var(--badge-image);
      border: 1px solid var(--badge-image);
    }

    .preview-container {
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      background-color: var(--bg-color);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      justify-content: center;
      align-items: center;
      margin-bottom: 0.75rem;
      padding: 0.75rem;
      min-height: 150px;
    }

    .preview-container img, 
    .preview-container video {
      max-width: 100%;
      max-height: 300px;
      border-radius: 6px;
      object-fit: contain;
    }

    .action-row {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .status-msg {
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-top: 0.5rem;
      display: none;
      word-break: break-word;
    }

    .status-msg.error {
      display: block;
      background-color: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--error);
      color: var(--error);
    }

    .status-msg.info {
      display: block;
      background-color: rgba(59, 130, 246, 0.1);
      border: 1px solid var(--accent);
      color: var(--accent);
    }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <header>
      <h1>Multi-Provider Media Downloader 5</h1>
      <p>Dedicated extractors for Google Maps, YouTube, TikTok, Snapchat, Twitter/X, and Instagram.</p>
    </header>

    <div class="grid-container">

      <!-- 1. GOOGLE MAPS -->
      <section class="card">
        <div>
          <h2>📍 Google Maps</h2>
          <div class="input-group">
            <input type="text" id="gmaps-url" placeholder="Paste Google Maps URL..." />
            <button onclick="extractGmaps()">Extract</button>
          </div>
          <div id="gmaps-status" class="status-msg"></div>
        </div>
        <div id="gmaps-output" class="output-area">
          <div class="media-badge badge-image">🖼️ Photo</div>
          <div class="preview-container">
            <img id="gmaps-preview" src="" alt="High-Res Google Maps" />
          </div>
          <div class="action-row">
            <button id="gmaps-download-btn">⬇️ Download High-Res</button>
          </div>
        </div>
      </section>

      <!-- 2. YOUTUBE -->
      <section class="card">
        <div>
          <h2>▶️ YouTube</h2>
          <div class="input-group">
            <input type="text" id="youtube-url" placeholder="Paste YouTube / Shorts URL..." />
            <button onclick="extractYouTube()">Extract</button>
          </div>
          <div id="youtube-status" class="status-msg"></div>
        </div>
        <div id="youtube-output" class="output-area">
          <div class="media-badge badge-video">📹 Video</div>
          <div id="youtube-preview" class="preview-container"></div>
          <div class="action-row" id="youtube-actions"></div>
        </div>
      </section>

      <!-- 3. TIKTOK -->
      <section class="card">
        <div>
          <h2>🎵 TikTok</h2>
          <div class="input-group">
            <input type="text" id="tiktok-url" placeholder="Paste TikTok Video URL..." />
            <button onclick="extractTikTok()">Extract</button>
          </div>
          <div id="tiktok-status" class="status-msg"></div>
        </div>
        <div id="tiktok-output" class="output-area">
          <div class="media-badge badge-video">📹 Video</div>
          <div id="tiktok-preview" class="preview-container"></div>
          <div class="action-row" id="tiktok-actions"></div>
        </div>
      </section>

      <!-- 4. SNAPCHAT -->
      <section class="card">
        <div>
          <h2>👻 Snapchat</h2>
          <div class="input-group">
            <input type="text" id="snapchat-url" placeholder="Paste Snapchat Spotlight URL..." />
            <button onclick="extractSnapchat()">Extract</button>
          </div>
          <div id="snapchat-status" class="status-msg"></div>
        </div>
        <div id="snapchat-output" class="output-area">
          <div class="media-badge badge-video">📹 Video</div>
          <div id="snapchat-preview" class="preview-container"></div>
          <div class="action-row" id="snapchat-actions"></div>
        </div>
      </section>

      <!-- 5. TWITTER / X -->
      <section class="card">
        <div>
          <h2>🐦 Twitter / X</h2>
          <div class="input-group">
            <input type="text" id="twitter-url" placeholder="Paste Twitter / X Tweet URL..." />
            <button onclick="extractTwitter()">Extract</button>
          </div>
          <div id="twitter-status" class="status-msg"></div>
        </div>
        <div id="twitter-output" class="output-area">
          <div id="twitter-badge"></div>
          <div id="twitter-preview" class="preview-container"></div>
          <div class="action-row" id="twitter-actions"></div>
        </div>
      </section>

      <!-- 6. INSTAGRAM -->
      <section class="card">
        <div>
          <h2>📸 Instagram</h2>
          <div class="input-group">
            <input type="text" id="instagram-url" placeholder="Paste Reel or Post URL..." />
            <button onclick="extractInstagram()">Extract</button>
          </div>
          <div id="instagram-status" class="status-msg"></div>
        </div>
        <div id="instagram-output" class="output-area">
          <div id="instagram-badge"></div>
          <div id="instagram-preview" class="preview-container"></div>
          <div class="action-row" id="instagram-actions"></div>
        </div>
      </section>

    </div>
  </div>

  <script>
    /**
     * Helper: Downloads media directly via blob trigger or dynamic anchor element
     */
    async function forceDownload(fileUrl, filename) {
      try {
        const res = await fetch(fileUrl, { mode: 'cors' });
        const blob = await res.blob();
        const blobUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(blobUrl);
      } catch (err) {
        // Fallback if CORS prevents blob reading
        const a = document.createElement('a');
        a.href = fileUrl;
        a.download = filename;
        a.target = '_blank';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }
    }

    /**
     * Helper: Proxy fallback fetcher
     */
    async function fetchProxy(url) {
      const proxies = [
        u => `https://api.allorigins.win/get?url=${encodeURIComponent(u)}`,
        u => `https://corsproxy.io/?${encodeURIComponent(u)}`,
        u => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`
      ];

      for (const p of proxies) {
        try {
          const res = await fetch(p(url));
          if (!res.ok) continue;
          if (p.toString().includes('allorigins')) {
            const data = await res.json();
            if (data.contents) return data.contents;
          } else {
            const text = await res.text();
            if (text && text.length > 50) return text;
          }
        } catch (e) {
          continue;
        }
      }
      throw new Error('CORS Proxy unreachable');
    }

    function setStatus(id, type, msg) {
      const el = document.getElementById(id);
      el.className = `status-msg ${type}`;
      el.textContent = msg;
    }

    /* ==========================================================================
       1. GOOGLE MAPS EXTRACTION
       ========================================================================== */
    function extractGmaps() {
      const input = document.getElementById('gmaps-url').value.trim();
      const output = document.getElementById('gmaps-output');
      const preview = document.getElementById('gmaps-preview');
      const downloadBtn = document.getElementById('gmaps-download-btn');

      output.classList.remove('active');
      if (!input) return setStatus('gmaps-status', 'error', 'Enter a valid URL.');

      const match = input.match(/(https?:\/\/[^"'\s=!#]+\.(?:googleusercontent|ggpht)\.com\/[^"'\s=!#]+)/i);
      let targetUrl = match ? match[1] : (input.includes('googleusercontent.com') ? input : null);

      if (!targetUrl) return setStatus('gmaps-status', 'error', 'No direct CDN image found in link.');

      let highRes = targetUrl.split('=')[0] + '=w4080-h4080';
      preview.src = highRes;

      downloadBtn.onclick = () => forceDownload(highRes, 'google-maps-photo.jpg');

      preview.onload = () => {
        output.classList.add('active');
        setStatus('gmaps-status', 'info', 'High-res image extracted.');
      };

      preview.onerror = () => {
        let fallback = targetUrl.split('=')[0] + '=s0';
        preview.src = fallback;
        downloadBtn.onclick = () => forceDownload(fallback, 'google-maps-photo.jpg');
        output.classList.add('active');
        setStatus('gmaps-status', 'info', 'Extracted via s0 fallback.');
      };
    }

    /* ==========================================================================
       2. YOUTUBE EXTRACTION
       ========================================================================== */
    function extractYouTube() {
      const input = document.getElementById('youtube-url').value.trim();
      const output = document.getElementById('youtube-output');
      const preview = document.getElementById('youtube-preview');
      const actions = document.getElementById('youtube-actions');

      output.classList.remove('active');
      if (!input) return setStatus('youtube-status', 'error', 'Enter a YouTube URL.');

      let vidId = '';
      try {
        const u = new URL(input);
        if (u.hostname.includes('youtu.be')) {
          vidId = u.pathname.slice(1);
        } else if (u.pathname.includes('/shorts/')) {
          vidId = u.pathname.split('/shorts/')[1].split('?')[0];
        } else {
          vidId = u.searchParams.get('v');
        }
      } catch (e) {
        return setStatus('youtube-status', 'error', 'Invalid URL.');
      }

      if (!vidId) return setStatus('youtube-status', 'error', 'Could not detect YouTube Video ID.');

      const thumbUrl = `https://img.youtube.com/vi/${vidId}/maxresdefault.jpg`;
      const directCobalt = `https://cobalt.tools`;

      preview.innerHTML = `
        <iframe src="https://www.youtube.com/embed/${vidId}" style="width:100%; height:200px; border:none; border-radius:6px;"></iframe>
      `;

      actions.innerHTML = `
        <button onclick="forceDownload('${thumbUrl}', 'youtube-thumbnail.jpg')">🖼️ Cover Image</button>
        <a href="${directCobalt}" target="_blank" rel="noopener">
          <button>📹 Download Video (Cobalt Downloader)</button>
        </a>
      `;

      output.classList.add('active');
      setStatus('youtube-status', 'info', 'YouTube Video detected.');
    }

    /* ==========================================================================
       3. TIKTOK EXTRACTION (DIRECT MP4 BINARY VIA API)
       ========================================================================== */
    async function extractTikTok() {
      const input = document.getElementById('tiktok-url').value.trim();
      const output = document.getElementById('tiktok-output');
      const preview = document.getElementById('tiktok-preview');
      const actions = document.getElementById('tiktok-actions');

      output.classList.remove('active');
      if (!input) return setStatus('tiktok-status', 'error', 'Enter a TikTok URL.');

      setStatus('tiktok-status', 'info', 'Fetching TikTok MP4 video stream...');

      try {
        // Query ssstik API endpoint for unwatermarked MP4 link
        const apiRes = await fetch(`https://ssstik.io/abc?url=dl`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8'
          },
          body: new URLSearchParams({ id: input, locale: 'en', tt: '1' })
        });

        const html = await apiRes.text();
        const mp4Match = html.match(/href="(https?:\/\/[^"]+\.mp4[^"]*)"/i) || html.match(/href="([^"]*ssstik[^"]*)"/i);

        if (mp4Match && mp4Match[1]) {
          const directMp4 = mp4Match[1];
          preview.innerHTML = `<video controls src="${directMp4}" style="max-height:250px;"></video>`;
          actions.innerHTML = `
            <button onclick="forceDownload('${directMp4}', 'tiktok-video.mp4')">⬇️ Download Video (MP4)</button>
          `;
          output.classList.add('active');
          setStatus('tiktok-status', 'info', 'TikTok MP4 stream ready!');
          return;
        }

        // Secondary fallback parsing
        const htmlFallback = await fetchProxy(input);
        const streamMatch = htmlFallback.match(/https?:\/\/[^"'\s]+\.tiktokcdn\.com\/[^"'\s]+\.mp4/i);

        if (streamMatch) {
          const videoUrl = streamMatch[0];
          preview.innerHTML = `<video controls src="${videoUrl}" style="max-height:250px;"></video>`;
          actions.innerHTML = `
            <button onclick="forceDownload('${videoUrl}', 'tiktok-video.mp4')">⬇️ Download Video (MP4)</button>
          `;
          output.classList.add('active');
          setStatus('tiktok-status', 'info', 'TikTok Video extracted.');
        } else {
          throw new Error('Could not parse MP4 binary.');
        }
      } catch (err) {
        setStatus('tiktok-status', 'error', 'Direct extraction failed. Use web parser fallback below.');
        preview.innerHTML = `<p style="font-size:0.85rem; color: var(--text-muted);">Parsing blocked by TikTok CDN token security.</p>`;
        actions.innerHTML = `
          <a href="https://ssstik.io/" target="_blank"><button class="btn-secondary">Open SSSTik Downloader</button></a>
        `;
        output.classList.add('active');
      }
    }

    /* ==========================================================================
       4. SNAPCHAT EXTRACTION
       ========================================================================== */
    async function extractSnapchat() {
      const input = document.getElementById('snapchat-url').value.trim();
      const output = document.getElementById('snapchat-output');
      const preview = document.getElementById('snapchat-preview');
      const actions = document.getElementById('snapchat-actions');

      output.classList.remove('active');
      if (!input) return setStatus('snapchat-status', 'error', 'Enter a Snapchat URL.');

      setStatus('snapchat-status', 'info', 'Fetching Snapchat video stream...');

      try {
        const html = await fetchProxy(input);

        // Regex specifically searching for video media tags instead of static posters
        const videoMatch = html.match(/<meta\s+property="og:video"\s+content="([^"]+)"/i) ||
                           html.match(/(https?:\/\/[^"'\s]+\.sc-cdn\.net\/[^"'\s>]+\.mp4[^"'\s]*)/i) ||
                           html.match(/(https?:\/\/[^"'\s]+\.sc-cdn\.net\/[a-zA-Z0-0_\/-]+)/i);

        if (videoMatch && videoMatch[1]) {
          let mediaUrl = videoMatch[1].replace(/&amp;/g, '&');
          preview.innerHTML = `<video controls src="${mediaUrl}" style="max-height:250px;"></video>`;
          actions.innerHTML = `
            <button onclick="forceDownload('${mediaUrl}', 'snapchat-video.mp4')">⬇️ Download Video (MP4)</button>
          `;
          output.classList.add('active');
          setStatus('snapchat-status', 'info', 'Snapchat Video extracted.');
        } else {
          throw new Error('No Snapchat video stream found.');
        }
      } catch (err) {
        setStatus('snapchat-status', 'error', 'Could not extract Snapchat video: ' + err.message);
      }
    }

    /* ==========================================================================
       5. TWITTER / X EXTRACTION
       ========================================================================== */
    async function extractTwitter() {
      const input = document.getElementById('twitter-url').value.trim();
      const output = document.getElementById('twitter-output');
      const preview = document.getElementById('twitter-preview');
      const actions = document.getElementById('twitter-actions');
      const badge = document.getElementById('twitter-badge');

      output.classList.remove('active');
      if (!input) return setStatus('twitter-status', 'error', 'Enter a Twitter / X URL.');

      const tweetIdMatch = input.match(/\/status\/(\d+)/);
      if (!tweetIdMatch) return setStatus('twitter-status', 'error', 'Invalid status URL format.');

      const tweetId = tweetIdMatch[1];
      setStatus('twitter-status', 'info', 'Querying Twitter media API...');

      try {
        // Query vxtwitter API mirror for media payloads
        const res = await fetch(`https://api.vxtwitter.com/Twitter/status/${tweetId}`);
        const data = await res.json();

        preview.innerHTML = '';
        actions.innerHTML = '';

        if (data.media_extended && data.media_extended.length > 0) {
          const isVid = data.media_extended.some(m => m.type === 'video' || m.type === 'gif');

          if (isVid) {
            badge.innerHTML = `<div class="media-badge badge-video">📹 Video</div>`;
          } else {
            badge.innerHTML = `<div class="media-badge badge-image">🖼️ Photo</div>`;
          }

          data.media_extended.forEach((m, idx) => {
            if (m.type === 'image') {
              preview.innerHTML += `<img src="${m.url}" alt="Tweet Image" />`;
              actions.innerHTML += `<button onclick="forceDownload('${m.url}', 'twitter-photo-${idx+1}.jpg')">⬇️ Photo ${idx+1}</button> `;
            } else if (m.type === 'video' || m.type === 'gif') {
              preview.innerHTML += `<video controls src="${m.url}" style="max-height:250px;"></video>`;
              actions.innerHTML += `<button onclick="forceDownload('${m.url}', 'twitter-video.mp4')">⬇️ Video (MP4)</button> `;
            }
          });

          output.classList.add('active');
          setStatus('twitter-status', 'info', 'Twitter/X Media extracted successfully.');
        } else {
          throw new Error('No media detected in tweet.');
        }
      } catch (err) {
        setStatus('twitter-status', 'error', 'Extraction failed: ' + err.message);
      }
    }

    /* ==========================================================================
       6. INSTAGRAM EXTRACTION
       ========================================================================== */
    async function extractInstagram() {
      const input = document.getElementById('instagram-url').value.trim();
      const output = document.getElementById('instagram-output');
      const preview = document.getElementById('instagram-preview');
      const actions = document.getElementById('instagram-actions');
      const badge = document.getElementById('instagram-badge');

      output.classList.remove('active');
      if (!input) return setStatus('instagram-status', 'error', 'Enter an Instagram URL.');

      setStatus('instagram-status', 'info', 'Fetching Instagram media stream...');

      try {
        // Replace instagram.com with ddinstagram API mirror
        let ddUrl = input.replace('instagram.com', 'ddinstagram.com');
        if (!ddUrl.endsWith('/')) ddUrl += '/';

        const html = await fetchProxy(ddUrl);

        const vidMatch = html.match(/<meta\s+property="og:video"\s+content="([^"]+)"/i);
        const imgMatch = html.match(/<meta\s+property="og:image"\s+content="([^"]+)"/i);

        preview.innerHTML = '';
        actions.innerHTML = '';

        if (vidMatch && vidMatch[1]) {
          const vidUrl = vidMatch[1].replace(/&amp;/g, '&');
          badge.innerHTML = `<div class="media-badge badge-video">📹 Instagram Reel / Video</div>`;
          preview.innerHTML = `<video controls src="${vidUrl}" style="max-height:250px;"></video>`;
          actions.innerHTML = `<button onclick="forceDownload('${vidUrl}', 'instagram-video.mp4')">⬇️ Download Video (MP4)</button>`;
        } else if (imgMatch && imgMatch[1]) {
          const imgUrl = imgMatch[1].replace(/&amp;/g, '&');
          badge.innerHTML = `<div class="media-badge badge-image">🖼️ Instagram Photo</div>`;
          preview.innerHTML = `<img src="${imgUrl}" alt="Instagram Media" />`;
          actions.innerHTML = `<button onclick="forceDownload('${imgUrl}', 'instagram-photo.jpg')">⬇️ Download Photo</button>`;
        } else {
          throw new Error('No public media stream found. Post may be private.');
        }

        output.classList.add('active');
        setStatus('instagram-status', 'info', 'Instagram media extracted.');
      } catch (err) {
        setStatus('instagram-status', 'error', 'Failed: ' + err.message);
      }
    }
  </script>
</body>
</html>
