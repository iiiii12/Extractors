<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi-Provider Media Extractor V 1.4</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --error: #ef4444;
      --success: #22c55e;
      --badge-video: #8b5cf6;
      --badge-image: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .main-wrapper {
      max-width: 1200px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      text-align: center;
      margin-bottom: 1rem;
    }

    header h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.5rem;
    }

    @media (max-width: 850px) {
      .grid-container {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card h2 {
      font-size: 1.15rem;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .input-group {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.75rem;
      margin-bottom: 0.75rem;
    }

    input[type="text"] {
      flex: 1;
      background-color: var(--bg-color);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.65rem 0.85rem;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      min-width: 0;
    }

    input:focus {
      border-color: var(--accent);
    }

    button {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 0.65rem 1.1rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    .btn-secondary {
      background-color: transparent;
      border: 1px solid var(--border);
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background-color: var(--border);
    }

    .output-area {
      margin-top: 0.75rem;
      border-top: 1px solid var(--border);
      padding-top: 0.75rem;
      display: none;
    }

    .output-area.active {
      display: block;
    }

    .media-badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 15px;
      font-size: 0.75rem;
      font-weight: bold;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }

    .badge-video {
      background-color: rgba(139, 92, 246, 0.2);
      color: var(--badge-video);
      border: 1px solid var(--badge-video);
    }

    .badge-image {
      background-color: rgba(16, 185, 129, 0.2);
      color: var(--badge-image);
      border: 1px solid var(--badge-image);
    }

    .preview-container {
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      background-color: var(--bg-color);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      justify-content: center;
      align-items: center;
      margin-bottom: 0.75rem;
      padding: 0.75rem;
      min-height: 150px;
    }

    .preview-container img, 
    .preview-container video {
      max-width: 100%;
      max-height: 280px;
      border-radius: 6px;
      object-fit: contain;
    }

    .action-row {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .status-msg {
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-top: 0.5rem;
      display: none;
      word-break: break-word;
    }

    .status-msg.error {
      display: block;
      background-color: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--error);
      color: var(--error);
    }

    .status-msg.info {
      display: block;
      background-color: rgba(59, 130, 246, 0.1);
      border: 1px solid var(--accent);
      color: var(--accent);
    }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <header>
      <h1 id="app-header-title">Multi-Provider Media Extractor V 1.4</h1>
      <p>Separate extractors arranged side-by-side for photos and video streams.</p>
    </header>

    <div class="grid-container">

      <!-- 1. GOOGLE MAPS -->
      <section class="card">
        <div>
          <h2>📍 Google Maps</h2>
          <div class="input-group">
            <input type="text" id="gmaps-url" placeholder="Paste Maps URL (normal or short)..." />
            <button onclick="extractGmapsImage()">Extract</button>
          </div>
          <div id="gmaps-status" class="status-msg"></div>
        </div>
        <div id="gmaps-output" class="output-area">
          <div class="preview-container">
            <img id="gmaps-preview" src="" alt="Google Maps High-Res Preview" />
          </div>
          <div class="action-row">
            <button id="gmaps-download-btn">⬇️ Download High-Res Image</button>
            <a id="gmaps-link" href="#" target="_blank" rel="noopener noreferrer">
              <button class="btn-secondary">Open Direct CDN URL</button>
            </a>
          </div>
        </div>
      </section>

      <!-- 2. YOUTUBE -->
      <section class="card">
        <div>
          <h2>▶️ YouTube</h2>
          <div class="input-group">
            <input type="text" id="youtube-url" placeholder="Paste YouTube / Shorts URL..." />
            <button onclick="extractYouTube()">Extract</button>
          </div>
          <div id="youtube-status" class="status-msg"></div>
        </div>
        <div id="youtube-output" class="output-area">
          <div class="media-badge badge-video">📹 Detected: YouTube Video</div>
          <div id="youtube-preview" class="preview-container"></div>
          <div class="action-row" id="youtube-actions"></div>
        </div>
      </section>

      <!-- 3. TIKTOK -->
      <section class="card">
        <div>
          <h2>🎵 TikTok</h2>
          <div class="input-group">
            <input type="text" id="tiktok-url" placeholder="Paste TikTok Video URL..." />
            <button onclick="extractTikTok()">Extract</button>
          </div>
          <div id="tiktok-status" class="status-msg"></div>
        </div>
        <div id="tiktok-output" class="output-area">
          <div class="media-badge badge-video">📹 Detected: TikTok Video</div>
          <div id="tiktok-preview" class="preview-container"></div>
          <div class="action-row" id="tiktok-actions"></div>
        </div>
      </section>

      <!-- 4. SNAPCHAT -->
      <section class="card">
        <div>
          <h2>👻 Snapchat</h2>
          <div class="input-group">
            <input type="text" id="snapchat-url" placeholder="Paste Snapchat Spotlight URL..." />
            <button onclick="extractSnapchat()">Extract</button>
          </div>
          <div id="snapchat-status" class="status-msg"></div>
        </div>
        <div id="snapchat-output" class="output-area">
          <div class="media-badge badge-video">📹 Detected: Snapchat Video</div>
          <div id="snapchat-preview" class="preview-container"></div>
          <div class="action-row" id="snapchat-actions"></div>
        </div>
      </section>

      <!-- 5. TWITTER / X -->
      <section class="card">
        <div>
          <h2>🐦 Twitter / X</h2>
          <div class="input-group">
            <input type="text" id="twitter-url" placeholder="Paste Tweet URL..." />
            <button onclick="extractTwitter()">Extract</button>
          </div>
          <div id="twitter-status" class="status-msg"></div>
        </div>
        <div id="twitter-output" class="output-area">
          <div id="twitter-badge"></div>
          <div id="twitter-preview" class="preview-container"></div>
          <div class="action-row" id="twitter-actions"></div>
        </div>
      </section>

      <!-- 6. INSTAGRAM -->
      <section class="card">
        <div>
          <h2>📸 Instagram</h2>
          <div class="input-group">
            <input type="text" id="instagram-url" placeholder="Paste Instagram Reel / Post URL..." />
            <button onclick="extractInstagram()">Extract</button>
          </div>
          <div id="instagram-status" class="status-msg"></div>
        </div>
        <div id="instagram-output" class="output-area">
          <div id="instagram-badge"></div>
          <div id="instagram-preview" class="preview-container"></div>
          <div class="action-row" id="instagram-actions"></div>
        </div>
      </section>

    </div>
  </div>

  <script>
    /* Version Tracking - V 1.4 */
    const APP_VERSION = "V 1.4";
    const APP_NAME = "Multi-Provider Media Extractor";

    window.addEventListener('DOMContentLoaded', () => {
      document.title = `${APP_NAME} ${APP_VERSION}`;
      const headerEl = document.getElementById('app-header-title');
      if (headerEl) headerEl.textContent = `${APP_NAME} ${APP_VERSION}`;
    });

    /* Helper: Triggers download via Blob or Direct Anchor */
    async function triggerDirectDownload(fileUrl, filename) {
      try {
        const response = await fetch(fileUrl, { mode: 'cors' });
        const blob = await response.blob();
        const blobUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(blobUrl);
      } catch (err) {
        const a = document.createElement('a');
        a.href = fileUrl;
        a.download = filename;
        a.target = '_blank';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }
    }

    function showStatus(elementId, type, message) {
      const el = document.getElementById(elementId);
      el.className = `status-msg ${type}`;
      el.textContent = message;
    }

    /* Helper: Multi-Tier CORS Proxy Engine for Short URLs */
    async function fetchWithMultiProxyFallback(targetUrl) {
      const proxies = [
        url => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
        url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
        url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
        url => `https://thingproxy.freeboard.io/fetch/${encodeURIComponent(url)}`
      ];

      for (let i = 0; i < proxies.length; i++) {
        try {
          const proxyUrl = proxies[i](targetUrl);
          const response = await fetch(proxyUrl);
          if (!response.ok) continue;

          if (proxies[i].toString().includes('allorigins')) {
            const data = await response.json();
            if (data.contents || data.status?.url) {
              return { content: data.contents || '', finalUrl: data.status?.url || targetUrl };
            }
          } else {
            const text = await response.text();
            if (text && text.length > 50) {
              return { content: text, finalUrl: response.url || targetUrl };
            }
          }
        } catch (e) {
          continue; // Try next proxy on failure
        }
      }
      throw new Error('All CORS proxies failed to resolve short URL.');
    }

    /* Exact matching logic for normal URLs - UNTOUCHED */
    function parseGmapsUrl(str) {
      try {
        const decodedUrl = decodeURIComponent(str);
        const match = decodedUrl.match(/(https:\/\/lh3\.googleusercontent\.com\/[^\s=]+)/);
        if (match && match[1]) {
          return match[1] + '=w2048';
        }
      } catch (e) {
        return null;
      }
      return null;
    }

    /* ==========================================================================
       1. GOOGLE MAPS EXTRACTION ENGINE V 1.4
       ========================================================================== */
    async function extractGmapsImage() {
      const inputRaw = document.getElementById('gmaps-url').value.trim();
      const statusId = 'gmaps-status';
      const output = document.getElementById('gmaps-output');
      const preview = document.getElementById('gmaps-preview');
      const link = document.getElementById('gmaps-link');
      const downloadBtn = document.getElementById('gmaps-download-btn');

      output.classList.remove('active');

      if (!inputRaw) {
        showStatus(statusId, 'error', 'Please enter a Google Maps URL.');
        return;
      }

      // Step 1: Try direct extraction first (Fast path for long URLs - UNTOUCHED)
      let highResUrl = parseGmapsUrl(inputRaw);

      // Step 2: If direct extraction failed, expand short URL via multi-proxy fallback
      if (!highResUrl) {
        showStatus(statusId, 'info', 'Expanding short link...');
        try {
          const proxyRes = await fetchWithMultiProxyFallback(inputRaw);

          // Check expanded target URL string
          highResUrl = parseGmapsUrl(proxyRes.finalUrl);

          // Check raw page HTML content if target URL alone didn't contain full image link
          if (!highResUrl && proxyRes.content) {
            highResUrl = parseGmapsUrl(proxyRes.content);
          }
        } catch (err) {
          showStatus(statusId, 'error', 'Could not expand short URL. Please verify your connection or try again.');
          return;
        }
      }

      if (!highResUrl) {
        showStatus(statusId, 'error', 'No valid Google image link found in this URL.');
        return;
      }

      // Display results
      preview.src = highResUrl;
      link.href = highResUrl;

      downloadBtn.onclick = () => {
        triggerDirectDownload(highResUrl, 'google-maps-photo-highres.jpg');
      };

      preview.onload = () => {
        output.classList.add('active');
        showStatus(statusId, 'info', 'Full-size image extracted successfully!');
      };

      preview.onerror = () => {
        showStatus(statusId, 'error', 'Error loading image from CDN.');
      };
    }

    /* ==========================================================================
       2. YOUTUBE EXTRACTION
       ========================================================================== */
    function extractYouTube() {
      const input = document.getElementById('youtube-url').value.trim();
      const output = document.getElementById('youtube-output');
      const preview = document.getElementById('youtube-preview');
      const actions = document.getElementById('youtube-actions');

      output.classList.remove('active');
      if (!input) return showStatus('youtube-status', 'error', 'Please enter a YouTube URL.');

      showStatus('youtube-status', 'info', 'Fetching video stream...');

      let vidId = '';
      try {
        const u = new URL(input);
        if (u.hostname.includes('youtu.be')) {
          vidId = u.pathname.slice(1).split('?')[0];
        } else if (u.pathname.includes('/shorts/')) {
          vidId = u.pathname.split('/shorts/')[1].split('?')[0];
        } else {
          vidId = u.searchParams.get('v');
        }
      } catch (e) {
        return showStatus('youtube-status', 'error', 'Invalid YouTube URL.');
      }

      if (!vidId) return showStatus('youtube-status', 'error', 'Could not parse YouTube Video ID.');

      const thumbUrl = `https://img.youtube.com/vi/${vidId}/maxresdefault.jpg`;

      preview.innerHTML = `<iframe src="https://www.youtube.com/embed/${vidId}" style="width:100%; height:220px; border:none; border-radius:6px;"></iframe>`;

      actions.innerHTML = `
        <button onclick="triggerDirectDownload('${thumbUrl}', 'youtube-cover.jpg')">🖼️ Download Cover Image</button>
        <a href="https://cobalt.tools" target="_blank"><button class="btn-secondary">⬇️ Download Video (MP4)</button></a>
      `;

      output.classList.add('active');
      showStatus('youtube-status', 'info', 'YouTube video stream ready.');
    }

    /* ==========================================================================
       3. TIKTOK EXTRACTION
       ========================================================================== */
    async function extractTikTok() {
      const input = document.getElementById('tiktok-url').value.trim();
      const output = document.getElementById('tiktok-output');
      const preview = document.getElementById('tiktok-preview');
      const actions = document.getElementById('tiktok-actions');

      output.classList.remove('active');
      if (!input) return showStatus('tiktok-status', 'error', 'Please enter a TikTok URL.');

      showStatus('tiktok-status', 'info', 'Fetching video stream...');

      try {
        const res = await fetchWithMultiProxyFallback(input);
        const htmlText = res.content;

        const mp4Match = htmlText.match(/https?:\/\/[^"'\s]+\.tiktokcdn\.com\/[^"'\s]+\.mp4[^"'\s]*/i) || 
                         htmlText.match(/\"playAddr\":\"(https?:\\\/\\\/[^"]+)\"/i);

        if (mp4Match) {
          let directMp4 = mp4Match[1] || mp4Match[0];
          directMp4 = directMp4.replace(/\\/g, '');

          preview.innerHTML = `<video controls src="${directMp4}" style="max-height:250px;"></video>`;
          actions.innerHTML = `<button onclick="triggerDirectDownload('${directMp4}', 'tiktok-video.mp4')">⬇️ Download Video (MP4)</button>`;
          output.classList.add('active');
          showStatus('tiktok-status', 'info', 'TikTok video stream ready!');
        } else {
          throw new Error('TikTok video signature protected.');
        }
      } catch (err) {
        showStatus('tiktok-status', 'info', 'Fetching video stream via secondary downloader bridge...');
        preview.innerHTML = `<p style="font-size:0.85rem; color: var(--text-muted);">Direct stream restricted by TikTok tokens. Use direct MP4 bridge below:</p>`;
        actions.innerHTML = `<a href="https://ssstik.io/" target="_blank"><button>⬇️ Download TikTok Video (MP4)</button></a>`;
        output.classList.add('active');
      }
    }

    /* ==========================================================================
       4. SNAPCHAT EXTRACTION
       ========================================================================== */
    async function extractSnapchat() {
      const input = document.getElementById('snapchat-url').value.trim();
      const output = document.getElementById('snapchat-output');
      const preview = document.getElementById('snapchat-preview');
      const actions = document.getElementById('snapchat-actions');

      output.classList.remove('active');
      if (!input) return showStatus('snapchat-status', 'error', 'Please enter a Snapchat URL.');

      showStatus('snapchat-status', 'info', 'Fetching video stream...');

      try {
        const res = await fetchWithMultiProxyFallback(input);
        const htmlText = res.content;

        const videoMatch = htmlText.match(/<meta\s+property="og:video"\s+content="([^"]+)"/i) ||
                           htmlText.match(/(https?:\/\/[^"'\s]+\.sc-cdn\.net\/[^"'\s>]+\.mp4[^"'\s]*)/i) ||
                           htmlText.match(/(https?:\/\/[^"'\s]+\.sc-cdn\.net\/[a-zA-Z0-9_\/-]+)/i);

        if (videoMatch && videoMatch[1]) {
          let videoUrl = videoMatch[1].replace(/&amp;/g, '&');
          preview.innerHTML = `<video controls src="${videoUrl}" style="max-height:250px;"></video>`;
          actions.innerHTML = `<button onclick="triggerDirectDownload('${videoUrl}', 'snapchat-video.mp4')">⬇️ Download Video (MP4)</button>`;
          output.classList.add('active');
          showStatus('snapchat-status', 'info', 'Snapchat video stream ready!');
        } else {
          throw new Error('No .mp4 video stream found in Snapchat payload.');
        }
      } catch (err) {
        showStatus('snapchat-status', 'error', 'Could not extract Snapchat video: ' + err.message);
      }
    }

    /* ==========================================================================
       5. TWITTER / X EXTRACTION
       ========================================================================== */
    async function extractTwitter() {
      const input = document.getElementById('twitter-url').value.trim();
      const output = document.getElementById('twitter-output');
      const preview = document.getElementById('twitter-preview');
      const actions = document.getElementById('twitter-actions');
      const badge = document.getElementById('twitter-badge');

      output.classList.remove('active');
      if (!input) return showStatus('twitter-status', 'error', 'Please enter a Twitter/X URL.');

      const tweetIdMatch = input.match(/\/status\/(\d+)/);
      if (!tweetIdMatch) return showStatus('twitter-status', 'error', 'Invalid Tweet URL.');

      const tweetId = tweetIdMatch[1];
      showStatus('twitter-status', 'info', 'Fetching video stream...');

      try {
        const res = await fetch(`https://api.vxtwitter.com/Twitter/status/${tweetId}`);
        const data = await res.json();

        preview.innerHTML = '';
        actions.innerHTML = '';

        if (data.media_extended && data.media_extended.length > 0) {
          const isVid = data.media_extended.some(m => m.type === 'video' || m.type === 'gif');

          if (isVid) {
            badge.innerHTML = `<div class="media-badge badge-video">📹 Detected: Twitter Video</div>`;
          } else {
            badge.innerHTML = `<div class="media-badge badge-image">🖼️ Detected: Twitter Photo</div>`;
          }

          data.media_extended.forEach((m, idx) => {
            if (m.type === 'image') {
              preview.innerHTML += `<img src="${m.url}" alt="Twitter Image" />`;
              actions.innerHTML += `<button onclick="triggerDirectDownload('${m.url}', 'twitter-photo-${idx+1}.jpg')">⬇️ Download Photo ${idx+1}</button> `;
            } else if (m.type === 'video' || m.type === 'gif') {
              preview.innerHTML += `<video controls src="${m.url}" style="max-height:250px;"></video>`;
              actions.innerHTML += `<button onclick="triggerDirectDownload('${m.url}', 'twitter-video.mp4')">⬇️ Download Video (MP4)</button> `;
            }
          });

          output.classList.add('active');
          showStatus('twitter-status', 'info', 'Twitter/X media stream ready!');
        } else {
          throw new Error('No media found in tweet.');
        }
      } catch (err) {
        showStatus('twitter-status', 'error', 'Failed to extract Twitter media: ' + err.message);
      }
    }

    /* ==========================================================================
       6. INSTAGRAM EXTRACTION
       ========================================================================== */
    async function extractInstagram() {
      const input = document.getElementById('instagram-url').value.trim();
      const output = document.getElementById('instagram-output');
      const preview = document.getElementById('instagram-preview');
      const actions = document.getElementById('instagram-actions');
      const badge = document.getElementById('instagram-badge');

      output.classList.remove('active');
      if (!input) return showStatus('instagram-status', 'error', 'Please enter an Instagram URL.');

      showStatus('instagram-status', 'info', 'Fetching video stream...');

      try {
        let ddUrl = input.replace('instagram.com', 'ddinstagram.com');
        if (!ddUrl.endsWith('/')) ddUrl += '/';

        const res = await fetchWithMultiProxyFallback(ddUrl);
        const htmlText = res.content;

        const vidMatch = htmlText.match(/<meta\s+property="og:video"\s+content="([^"]+)"/i);
        const imgMatch = htmlText.match(/<meta\s+property="og:image"\s+content="([^"]+)"/i);

        preview.innerHTML = '';
        actions.innerHTML = '';

        if (vidMatch && vidMatch[1]) {
          const vidUrl = vidMatch[1].replace(/&amp;/g, '&');
          badge.innerHTML = `<div class="media-badge badge-video">📹 Detected: Instagram Video</div>`;
          preview.innerHTML = `<video controls src="${vidUrl}" style="max-height:250px;"></video>`;
          actions.innerHTML = `<button onclick="triggerDirectDownload('${vidUrl}', 'instagram-video.mp4')">⬇️ Download Video (MP4)</button>`;
        } else if (imgMatch && imgMatch[1]) {
          const imgUrl = imgMatch[1].replace(/&amp;/g, '&');
          badge.innerHTML = `<div class="media-badge badge-image">🖼️ Detected: Instagram Photo</div>`;
          preview.innerHTML = `<img src="${imgUrl}" alt="Instagram Image" />`;
          actions.innerHTML = `<button onclick="triggerDirectDownload('${imgUrl}', 'instagram-photo.jpg')">⬇️ Download Photo</button>`;
        } else {
          throw new Error('No media found in Instagram link.');
        }

        output.classList.add('active');
        showStatus('instagram-status', 'info', 'Instagram media stream ready!');
      } catch (err) {
        showStatus('instagram-status', 'error', 'Failed to extract Instagram media: ' + err.message);
      }
    }
  </script>
</body>
